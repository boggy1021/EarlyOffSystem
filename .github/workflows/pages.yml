# 把 liff/ 部署到 GitHub Pages（LIFF 小網頁的前端）
name: Deploy LIFF to Pages

on:
  push:
    branches: [main]
    paths: ['liff/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: liff
      - id: deployment
        uses: actions/deploy-pages@v4
